# The result sink as a GitHub Action, for the gate and post-submit builders (plan §5.2).
# Use it after the test steps, with `if: always()`, pinned by commit:
#
#   - uses: quirq-ai/test-pipelines/sink@<commit>
#     if: always()
#     with:
#       junit: results/*.xml
#
# It writes the run's bundle (run, results, verdict) and keeps it as a workflow artifact named
# after the run, which the results store imports (V0-TST-02). A job with no reports still stores
# a run, marked as having no results, because a missing signal is not a pass.
#
# By default it never fails the job for failing tests, only when a report is not JUnit XML.
# With `rerun` (V0-TST-03) it retries failed tests and compares them with base, storing those
# runs too; with `fail-on-verdict: "true"` the final verdict decides the job, so the test step
# itself should use `continue-on-error: true`.
name: qq result sink
description: Store this job's JUnit test results as a quirq infra results bundle.
inputs:
  junit:
    description: Report globs relative to the workspace, one per line (** allowed).
    required: true
  name:
    description: >-
      Tells apart several sinks in one job. Required under a matrix, where every leg shares the
      job id: pass the matrix values or strategy.job-index, or the artifact names collide.
    required: false
    default: ""
  kind:
    description: Override the run kind (presubmit, gate, postsubmit, canary, other).
    required: false
    default: ""
  commit:
    description: >-
      Override the commit tested (40 hex), for a dispatched run that checked out another commit
      than GITHUB_SHA, e.g. a backfill that passes the workflow_dispatch commit input (see README).
    required: false
    default: ""
  rerun:
    description: >-
      A shell command that reruns tests, writing JUnit XML to $QQ_JUNIT_DIR ($QQ_RETRY_TESTS
      lists the failed test ids). Failed tests are retried, then compared with base; only
      failures that pass without the change fail the verdict.
    required: false
    default: ""
  setup:
    description: >-
      For rerun: a shell command that prepares a checkout (install or build from $PWD). It runs in
      the base worktree before the base tests and in the change's checkout afterwards. Needed
      whenever the tests import installed code rather than the working tree.
    required: false
    default: ""
  base:
    description: >-
      One more base for rerun; a failure must fail at it as well as at the run's own bases (the
      tested commit without the change: a PR or queue entry's first parent, a push's before; and
      the target branch's commit). It never replaces them. A queue entry whose tested commit is
      neither a merge nor a child of the target branch's commit may be from a rebase queue and
      is not compared, with or without this input (README).
    required: false
    default: ""
  infra-config:
    description: Path of an infra-config checkout whose flakes.toml sets the retry policy.
    required: false
    default: ""
  fail-on-verdict:
    description: Set to "true" to fail when the verdict fails, so the sink decides the check.
    required: false
    default: "false"
  retention-days:
    description: How long GitHub keeps the bundle artifact. TODO(expert) long-term storage.
    required: false
    default: "90"
outputs:
  bundle:
    description: Path of the run's bundle directory.
    value: ${{ steps.sink.outputs.bundle }}
  passed:
    description: "\"true\" when the run's verdict passed."
    value: ${{ steps.sink.outputs.passed }}
runs:
  using: composite
  steps:
    - id: sink
      shell: bash
      env:
        QQ_JUNIT: ${{ inputs.junit }}
        QQ_NAME: ${{ inputs.name }}
        QQ_KIND: ${{ inputs.kind }}
        QQ_COMMIT: ${{ inputs.commit }}
        QQ_JOB_STATUS: ${{ job.status }}
        QQ_RERUN: ${{ inputs.rerun }}
        QQ_BASE: ${{ inputs.base }}
        QQ_SETUP: ${{ inputs.setup }}
        QQ_INFRA_CONFIG: ${{ inputs.infra-config }}
      run: |
        set -euo pipefail
        python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))' || {
          echo "::error::qq result sink needs Python 3.11 or newer as python3 (actions/setup-python)"; exit 1; }
        # Run from this action's own source (no dependencies): nothing is fetched from PyPI, and
        # sys.path is set inside the process so the tests the sink reruns do not inherit it.
        qqresults() {
          python3 -P -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from qqresults.cli import main; sys.exit(main(sys.argv[1:]))' \
            "$GITHUB_ACTION_PATH/../src" "$@"
        }
        args=()
        while IFS= read -r glob; do
          [ -n "$glob" ] && args+=(--junit "$glob")
        done <<< "$QQ_JUNIT"
        [ ${#args[@]} -gt 0 ] || { echo "::error::qq result sink: the junit input is empty"; exit 1; }
        [ -z "$QQ_NAME" ] || args+=(--name "$QQ_NAME")
        [ -z "$QQ_KIND" ] || args+=(--kind "$QQ_KIND")
        [ -z "$QQ_COMMIT" ] || args+=(--commit "$QQ_COMMIT")
        [ -z "$QQ_RERUN" ] || args+=(--rerun "$QQ_RERUN")
        [ -z "$QQ_BASE" ] || args+=(--base "$QQ_BASE")
        [ -z "$QQ_SETUP" ] || args+=(--setup "$QQ_SETUP")
        [ -z "$QQ_INFRA_CONFIG" ] || args+=(--infra-config "$QQ_INFRA_CONFIG")
        out=$(mktemp -d "$RUNNER_TEMP/qq-results.XXXXXX")
        echo "out=$out" >> "$GITHUB_OUTPUT"
        qqresults sink "${args[@]}" --root "$GITHUB_WORKSPACE" --out "$out"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always() && steps.sink.outputs.name != ''
      with:
        name: ${{ steps.sink.outputs.name }}
        path: ${{ steps.sink.outputs.out }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
    - name: verdict
      if: inputs.fail-on-verdict == 'true' && steps.sink.outputs.passed != 'true'
      shell: bash
      run: |
        echo "::error::the test verdict failed after retries and the base comparison; see the sink step"
        exit 1
