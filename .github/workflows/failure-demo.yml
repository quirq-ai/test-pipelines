# V0-TST-04 done-when, against the real GitHub API: a held canary creates exactly one failure
# record and one issue. Reports the same planted held canary twice (as a retrying pipeline would),
# then checks there is one issue with its marker and one record in a store collected from the
# artifacts. The planted record is then linked and closed. Its subject never changes, so every run
# reuses the same record and issue.
name: failure-demo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - failure/**
      - src/qqresults/failures.py
      - src/qqresults/backends/github.py
      - .github/workflows/failure-demo.yml
  push:
    branches: [main]
    paths:
      - failure/**
      - src/qqresults/failures.py
      - src/qqresults/backends/github.py
      - .github/workflows/failure-demo.yml
permissions:
  contents: read
  issues: write      # open and update the one demo issue in this repo
  actions: read      # collect this run's failure artifact
concurrency:
  group: failure-demo
  cancel-in-progress: false
jobs:
  held-canary:
    # A fork's pull_request token cannot write issues; the demo runs for this repo's own branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: first
        uses: ./failure
        with:
          kind: canary-held
          subject: planted-canary-demo-v0
          summary: "Planted held canary (V0-TST-04 demo, not a real failure)"
          stage: probe
          signal: health
      - id: second
        uses: ./failure
        with:
          kind: canary-held
          subject: planted-canary-demo-v0
          summary: "Planted held canary (V0-TST-04 demo, not a real failure)"
          stage: probe
          signal: health
      - name: one record, one issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIRST_ISSUE: ${{ steps.first.outputs.issue }}
          SECOND_ISSUE: ${{ steps.second.outputs.issue }}
          SECOND_CREATED: ${{ steps.second.outputs.created }}
          ID: ${{ steps.first.outputs.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$FIRST_ISSUE" && test "$FIRST_ISSUE" = "$SECOND_ISSUE"
          test "$SECOND_CREATED" = "false"
          issues=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=qq-failure&state=all&per_page=100" \
                     --jq "[.[] | select((.body // \"\" | startswith(\"<!-- qq-failure: $ID -->\"))
                                         and .state_reason != \"duplicate\")] | length" \
                   | awk '{s+=$1} END {print s}')
          # The issue list can lag a create, so two runners (or one runner's two calls) may both
          # open one; the later is closed as a duplicate and does not count.
          echo "issues with the record's marker (not closed as duplicate): $issues"
          test "$issues" = "1"
          python -m pip install --quiet .
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            # collect takes failure records only from default-branch runs, so any other ref (a PR,
            # a dispatch on a branch or tag) checks the record its own job wrote (the directory the
            # failure action keeps).
            mkdir -p "$RUNNER_TEMP/store" && cp -R "$RUNNER_TEMP/qq-failures" "$RUNNER_TEMP/store/failures"
          else
            qqresults collect --store "$RUNNER_TEMP/store" --repo "$GITHUB_REPOSITORY" \
              --workflow .github/workflows/failure-demo.yml
          fi
          records=$(qqresults failure list --dir "$RUNNER_TEMP/store/failures" | grep -c "$ID" || true)
          echo "records with id $ID: $records"
          test "$records" = "1"
          echo "OK: one failure record ($ID) and one issue ($FIRST_ISSUE)"
      - name: link and close the planted record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          qqresults failure link "${{ steps.first.outputs.id }}" --dir "$RUNNER_TEMP/store/failures"
          --culprit "planted (demo)" --fix "none needed (demo)"
          --covering-test "tests/test_failures.py::test_a_held_canary_creates_exactly_one_record_and_one_issue"
          --mirror "$GITHUB_REPOSITORY"
