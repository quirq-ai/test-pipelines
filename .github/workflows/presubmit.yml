# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read     # V0-TST-02 check below reads this repo's result artifacts
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider --junitxml=.qq/out/junit/tests.xml
      # V0-TST-03 done-when: a planted failure that also fails on base does not block, and a
      # failure the change introduced does, decided by the sink after retry and base comparison.
      - name: planted failure demo (retry, then compare with base)
        run: tools/planted_demo.sh "$RUNNER_TEMP/planted"
      # V0-TST-01 done-when: every gate run's test results are stored. This repo's own runs go
      # through the same sink the generated builders use, kept as a workflow artifact per run.
      - id: sink
        uses: ./sink
        if: always()
        with:
          junit: .qq/out/junit/*.xml
      - name: the stored bundle reads back
        if: always() && steps.sink.outputs.bundle != ''
        run: qqresults show "${{ steps.sink.outputs.bundle }}"
      # V0-TST-02: the store and scorecard read real runs. Collects this repo's stored results
      # through the GitHub API into a scratch store (the scorecard workflow keeps the real one).
      - name: collect into a scratch store and compute the scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          qqresults collect --store "$RUNNER_TEMP/store" --repo "$GITHUB_REPOSITORY"
          qqresults query runs --store "$RUNNER_TEMP/store" | tail -5
          qqresults scorecard --store "$RUNNER_TEMP/store" --days 30 | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(qqresults query runs --store "$RUNNER_TEMP/store")"
