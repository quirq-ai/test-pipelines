# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read     # V0-TST-02 check below reads this repo's result artifacts
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # gate's code runs in this job; no step pushes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The pin must be a full commit id: a branch or tag name would move under the pin, and a
      # newline would inject extra step outputs.
      - name: read the gate pin
        id: gatepin
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys, tomllib
          commit = tomllib.load(open("pins.toml", "rb"))["gate"]["commit"]
          if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              sys.exit(f"pins.toml [gate] commit must be a 40-character lowercase hex commit id, got {commit!r}")
          print("commit=" + commit)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/gate
          ref: ${{ steps.gatepin.outputs.commit }}
          path: .qq/gate
          persist-credentials: false
      # From source with the standard library only: no pip, so nothing from PyPI runs in the job
      # that uploads this repo's postsubmit bundle. -S skips site-packages, -P keeps the checkout
      # off sys.path, so only the pinned gate source and the standard library are importable.
      - name: core code names no language, build tool or deploy target (gate's agnosticism guard)
        env:
          PYTHONPATH: .qq/gate/src
        run: python -S -P -c 'import sys; from qqgate.cli import main; sys.exit(main())' guard --repo test-pipelines --github .
      - run: |   # qqresults runs from source; only the pinned test runner is installed
          python -m pip install --quiet --only-binary=:all: "pytest==9.1.1"
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - run: python -m pytest -q -p no:cacheprovider --junitxml=.qq/out/junit/tests.xml
      # V0-TST-03 done-when: a planted failure that also fails on base does not block, and a
      # failure the change introduced does, decided by the sink after retry and base comparison.
      - name: planted failure demo (retry, then compare with base)
        run: tools/planted_demo.sh "$RUNNER_TEMP/planted"
      # V0-TST-01 done-when: every gate run's test results are stored. This repo's own runs go
      # through the same sink the generated builders use, kept as a workflow artifact per run.
      - id: sink
        uses: ./sink
        if: always()
        with:
          junit: .qq/out/junit/*.xml
      - name: the stored bundle reads back
        if: always() && steps.sink.outputs.bundle != ''
        run: qqresults show "${{ steps.sink.outputs.bundle }}"
      # V0-TST-02: the store and scorecard read real runs. Collects this repo's stored results
      # through the GitHub API into a scratch store (the scorecard workflow keeps the real one).
      - name: collect into a scratch store and compute the scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          qqresults collect --store "$RUNNER_TEMP/store" --repo "$GITHUB_REPOSITORY"
          qqresults query runs --store "$RUNNER_TEMP/store" | tail -5
          qqresults scorecard --store "$RUNNER_TEMP/store" --days 30 | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(qqresults query runs --store "$RUNNER_TEMP/store")"
